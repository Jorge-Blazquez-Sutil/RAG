[project]
name = "rag-assistant"
version = "0.1.0"
description = "Asistente RAG de Nicho — backend FastAPI y prototipo Streamlit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
]

# Cada rama de módulo añade aquí sus dependencias:
#   ingestion  -> pymupdf, python-docx, langchain-text-splitters, tiktoken
#   storage    -> chromadb
#   retrieval  -> sentence-transformers (cross-encoder)
#   ui         -> streamlit

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
# Para que `app.*` se ordene como paquete de primera parte, no como dependencia externa.
src = ["backend", "tests"]
extend-exclude = [".venv", "data", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # Depends() en firmas de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = "-q"
